<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Presenze e partite</title>
<link rel="manifest" href="manifest-genitori.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#1f2937">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Presenze">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#111827;color:#f3f4f6;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
header{background:#1f2937;border-bottom:1px solid #374151;padding:14px 16px;text-align:center}
header h1{margin:0;font-size:18px}
main{max-width:520px;margin:0 auto;padding:16px 12px 40px}
.hello{text-align:center;margin:6px 0 16px;font-size:17px}
.hello b{color:#60a5fa}
.card{background:#1f2937;border:1px solid #374151;border-radius:12px;padding:14px;margin-bottom:12px}
.when{font-size:13px;color:#9ca3af}
.vs{font-size:17px;font-weight:700;margin:6px 0 12px}
.btns{display:flex;gap:8px}
.b{flex:1;padding:14px 6px;border-radius:10px;border:2px solid #4b5563;background:#374151;color:#f3f4f6;font-size:16px;font-weight:700;cursor:pointer}
.b:active{opacity:.7}
.b.si.on{background:#15803d;border-color:#22c55e}
.b.no.on{background:#b91c1c;border-color:#ef4444}
.msg{text-align:center;color:#9ca3af;padding:30px 10px}
.err{color:#fca5a5}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#065f46;color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
.toast.bad{background:#991b1b}
.next{border:2px solid #3b82f6;box-shadow:0 0 0 4px #3b82f633;padding:18px 16px;margin-bottom:18px}
.next .lab{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#60a5fa;margin-bottom:6px}
.next .when{font-size:15px;color:#d1d5db}
.next .vs{font-size:22px;margin:8px 0 6px}
.next .state{font-size:14px;margin:0 0 14px}
.next .state.ok{color:#4ade80}.next .state.wait{color:#fbbf24}.next .state.no{color:#f87171}
.next .b{padding:20px 6px;font-size:18px}
details.more{margin-top:6px}
details.more summary{cursor:pointer;color:#9ca3af;font-size:14px;padding:10px 4px;list-style:none;text-align:center;border:1px dashed #374151;border-radius:10px;margin-bottom:12px}
details.more[open] summary{margin-bottom:12px}
details.more .card{opacity:.92}
.tabs{display:flex;background:#1f2937;border-bottom:1px solid #374151;position:sticky;top:0;z-index:5;margin:-16px -12px 14px}
.tabs button{flex:1;padding:13px 2px;background:none;border:0;border-bottom:2px solid transparent;color:#9ca3af;font-size:14px;cursor:pointer}
.tabs button.on{color:#60a5fa;border-color:#60a5fa;font-weight:700}
.chips{display:flex;gap:6px;margin-bottom:12px}
.chip{padding:6px 12px;border-radius:999px;border:1px solid #374151;background:#1f2937;color:#9ca3af;font-size:13px;cursor:pointer}
.chip.on{background:#1d4ed8;color:#fff;border-color:#1d4ed8}
.res{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:6px}
.res .t{flex:1;font-weight:600;font-size:14px}.res .t.h{text-align:right}
.res .sc{min-width:64px;text-align:center;font-size:20px;font-weight:800;background:#0f172a;border-radius:8px;padding:6px 8px}
.res .sc.na{color:#6b7280;font-weight:600;font-size:15px}
.card.sam{border-color:#2563eb}
.old{text-decoration:line-through;color:#6b7280;margin-right:6px}.new{color:#4ade80;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:13px;text-align:center}
th,td{border:1px solid #4b5563;padding:7px 3px}th{background:#374151}
td.l,th.l{text-align:left;padding-left:8px}
tr.q{background:#14532d44}tr.e{background:#7f1d1d44}tr.me td.l{color:#93c5fd;font-weight:700}
.pos{color:#4ade80}.neg{color:#f87171}
.legend{font-size:12px;color:#9ca3af;margin-top:10px}
.legend i{display:inline-block;width:11px;height:11px;margin-right:5px;vertical-align:-1px}
.cnt{font-size:14px;color:#d1d5db;margin:0 0 12px}
.cnt b{color:#4ade80}
.next .cnt{font-size:15px;margin:-4px 0 14px}
.ov{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:18px;z-index:50}
.ov.on{display:flex}
.pop{background:#1f2937;border:1px solid #4b5563;border-radius:16px;width:100%;max-width:340px;padding:22px 20px;text-align:center}
.pop .ic{font-size:40px;margin-bottom:6px}
.pop h2{margin:0 0 8px;font-size:19px}
.pop p{margin:0 0 6px;color:#d1d5db;font-size:15px;line-height:1.4}
.pop .inf{font-size:14px;margin:10px 0 16px;padding:8px 10px;border-radius:8px;background:#0f172a}
.pop .inf.ok{color:#4ade80}.pop .inf.wait{color:#fbbf24}
.pop .pb{display:flex;flex-direction:column;gap:8px}
.pop button{padding:14px;border-radius:10px;border:0;font-size:16px;font-weight:700;cursor:pointer;color:#fff}
.pop .go{background:#2563eb}.pop .go.si{background:#15803d}.pop .go.no{background:#b91c1c}.pop .go.rm{background:#6b7280}
.pop .cc{background:#374151}
.min{font-size:14px;margin:0 0 12px;padding:8px 10px;border-radius:8px;font-weight:600}
.min.ok{background:#14532d88;color:#4ade80}.min.wait{background:#78350f88;color:#fbbf24}
.sec{font-size:14px;font-weight:700;color:#9ca3af;margin:14px 2px 8px}
.next .res{margin-top:10px}
.nt{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;font-weight:700}
.nt.promemoria{background:#1e3a8a;color:#93c5fd}.nt.info{background:#374151;color:#d1d5db}.nt.importante{background:#7f1d1d;color:#fca5a5}
.ntext{white-space:pre-wrap;font-size:15px;margin-top:6px;word-break:break-word;line-height:1.45;color:#e5e7eb}
.ntitle{font-weight:700;font-size:16px;margin-top:8px}
.nmeta{font-size:12px;color:#9ca3af}
.newb{display:inline-block;background:#dc2626;color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:1px 7px;margin-left:4px}
.card.imp{border-color:#b91c1c}
.card.pin{border-color:#ca8a04;background:#422006}
.banner{display:block;width:100%;text-align:left;background:#1e3a8a;border:1px solid #2563eb;color:#fff;border-radius:10px;padding:11px 12px;font-size:15px;margin-bottom:12px;cursor:pointer}
.pbox{background:#0f172a;border:1px solid #2563eb;border-radius:12px;padding:12px;margin-bottom:12px;font-size:14px;line-height:1.45}
.pbox .pb2{display:flex;gap:8px;margin-top:10px}
.pbox button{flex:1;padding:11px;border-radius:9px;border:0;font-size:15px;font-weight:700;cursor:pointer;color:#fff;background:#2563eb}
.pbox button.sec{background:#374151;flex:none;padding:11px 14px}
.foot{text-align:center;font-size:12px;color:#6b7280;margin-top:18px}
</style>
</head>
<body>
<header><h1>⚽ Presenze e partite</h1></header>
<main id="main"><div class="msg">Caricamento…</div></main>
<div class="toast" id="toast"></div>
<div class="ov" id="ov"><div class="pop" id="pop"></div></div>
<script>
const q = new URLSearchParams(location.search);
const DB = (q.get('d')||'').replace(/\/+$/,'');
const TOK = q.get('f')||'';
const main = document.getElementById('main');
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let vapid = null, pState = 'nokey', fam = null, rsvp = {}, votes = {}, news = {}, pub = null, tab = 'pres', calFilter = 'all';
let ME = 'Sam 89', selT = null;
const MIN = 5; // minimo di bambini per giocare

function toast(t,bad){ const e=document.getElementById('toast'); e.textContent=t; e.className='toast on'+(bad?' bad':''); setTimeout(()=>e.className='toast'+(bad?' bad':''),2200); }
function parseD(s){ const p=(s||'').split('/'); return p.length===3 ? new Date(+p[2],+p[1]-1,+p[0]) : null; }
const DAYS = ['Domenica','Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato'];

async function init(){
  if(!/^https:\/\//.test(DB) && !/^http:\/\/localhost/.test(DB) || !/^[A-Za-z0-9_-]{12,}$/.test(TOK)){
    main.innerHTML = '<div class="msg err">Link non valido. Chiedi di nuovo il link all\'allenatore.</div>'; return;
  }
  try{
    const r = await fetch(`${DB}/families/${TOK}.json`); if(!r.ok) throw 0;
    fam = await r.json();
    if(!fam){ main.innerHTML = '<div class="msg err">Link non valido o non più attivo. Chiedi di nuovo il link all\'allenatore.</div>'; return; }
    await loadRsvp();
    try{ const pr = await fetch(`${DB}/public.json`); pub = pr.ok ? await pr.json() : null; }catch(e){ pub = null; }
    await loadVotes(); await loadNews();
    try{ const vr = await fetch(`${DB}/config/vapid.json`); vapid = vr.ok ? await vr.json() : null; }catch(e){}
    pState = await pushState(vapid);
    if(location.hash === '#avvisi') tab = 'avv';
    window.addEventListener('hashchange', () => { if(location.hash === '#avvisi'){ tab = 'avv'; refreshAll(); } });
    render();
    setInterval(refreshAll, 10*60*1000);
    document.addEventListener('visibilitychange', () => { if(!document.hidden) refreshAll(); });
  }catch(e){ main.innerHTML = '<div class="msg err">Impossibile collegarsi. Controlla la connessione e riprova.</div>'; }
}
async function loadVotes(){ try{ const r = await fetch(`${DB}/votes.json`); votes = (r.ok && await r.json()) || {}; }catch(e){} }
async function refreshAll(){
  try{
    const fr = await fetch(`${DB}/families/${TOK}.json`); if(fr.ok){ const f = await fr.json(); if(f) fam = f; }
    await loadRsvp(); await loadVotes(); await loadNews();
    const pr = await fetch(`${DB}/public.json`); if(pr.ok){ const d = await pr.json(); if(d) pub = d; }
    render();
  }catch(e){}
}
function countsOf(id){ let si=0,no=0; Object.values(votes[id]||{}).forEach(x => { if(x==='si') si++; else if(x==='no') no++; }); return {si,no}; }
function minLine(si){
  return si >= MIN
    ? `<div class="min ok">✅ Minimo raggiunto: ci siamo per giocare! (${si}/${MIN})</div>`
    : `<div class="min wait">⏳ Mancano ${MIN-si} bambin${MIN-si===1?'o':'i'} per arrivare al minimo di ${MIN}</div>`;
}
function cntLine(id){
  const {si,no} = countsOf(id), n = pub && pub.n ? pub.n : 0;
  return `<div class="cnt">👥 Finora <b>${si}</b>${n?` su ${n}`:''} ci saranno${no?` · ${no} non ci sarà${no>1?'nno':''}`:''}</div>${minLine(si)}`;
}
async function loadRsvp(){ const r = await fetch(`${DB}/rsvp/${TOK}.json`); rsvp = (r.ok && await r.json()) || {}; }

let moreOpen = false;
function matchCard(m, big){
  const v = rsvp[m.id];
  const btns = `<div class="btns"><button class="b si ${v==='si'?'on':''}" onclick="set('${m.id}','si')">✅ Ci sarà</button>
      <button class="b no ${v==='no'?'on':''}" onclick="set('${m.id}','no')">❌ Non ci sarà</button></div>`;
  const many = new Set(Object.values(fam.matches||{}).map(x => x.t).filter(Boolean)).size > 1;
  const when = `${many && m.t ? `<b style="color:#93c5fd">${esc(m.t)}</b> · ` : ''}${DAYS[m.d.getDay()]} ${esc(m.date)} · ore ${esc(m.time)}`;
  const vs = `${esc(m.home)} <span style="color:#6b7280">vs</span> ${esc(m.away)}`;
  if(!big) return `<div class="card"><div class="when">${when}</div><div class="vs">${vs}</div>${cntLine(m.id)}${btns}</div>`;
  const state = v==='si' ? '<div class="state ok">✓ Hai risposto: ci sarà</div>' : v==='no' ? '<div class="state no">Hai risposto: non ci sarà</div>' : '<div class="state wait">Non hai ancora risposto</div>';
  return `<div class="card next"><div class="lab">Prossima partita</div><div class="when">${when}</div><div class="vs">${vs}</div>${state}${cntLine(m.id)}${btns}</div>`;
}
function renderPres(){
  const today = new Date(); today.setHours(0,0,0,0);
  const ms = Object.entries(fam.matches||{}).map(([id,m])=>({id,...m,d:parseD(m.date)}))
    .filter(m => m.d && m.d >= today).sort((a,b)=>a.d-b.d || String(a.time).localeCompare(String(b.time)));
  let h = '';
  const u = unread(); if(u) h += `<button class="banner" onclick="setTab('avv')">📣 ${u===1?'C\'è 1 nuovo avviso':'Ci sono '+u+' nuovi avvisi'} — tocca per leggere</button>`;
  liveNews().filter(n => n.pin).forEach(n => { h += newsCard(n, false); });
  h += `<div class="hello">Presenza di <b>${esc(fam.name)}</b></div>`;
  h += pushBox(true);
  if(!ms.length){ h += '<div class="msg">Non ci sono partite in programma.</div>'; }
  else {
    h += matchCard(ms[0], true);
    const rest = ms.slice(1);
    if(rest.length) h += `<details class="more" ${moreOpen?'open':''} ontoggle="moreOpen=this.open"><summary>Altre partite (${rest.length})</summary>${rest.map(m=>matchCard(m,false)).join('')}</details>`;
  }
  h += '<div class="foot">Puoi cambiare risposta quando vuoi. Tocca di nuovo il pulsante scelto per toglierla.</div>';
  return h;
}
function tList(){
  if(!pub) return [];
  if(pub.tournaments) return Object.entries(pub.tournaments).map(([id,t]) => ({id, ...t, teams:Object.values(t.teams||{}), matches:Object.values(t.matches||{}).filter(Boolean)}));
  if(pub.matches) return [{id:'x', name:'Campionato', me:'Sam 89', q:4, teams:[], matches:Object.values(pub.matches).filter(Boolean)}];
  return [];
}
function curT(){ const l = tList(); return l.find(t => t.id===selT) || l.find(t => t.id===pub.cur) || l[0]; }
function allMatches(){ const t = curT(); if(t) ME = t.me; return t ? t.matches : []; }
function tChips(){
  const l = tList(); if(l.length < 2) return '';
  const c = curT();
  return `<div class="chips" style="flex-wrap:wrap">${l.map(t => `<span class="chip ${t.id===c.id?'on':''}" onclick="selT='${t.id}';render()">${esc(t.name)}</span>`).join('')}</div>`;
}
const effDate = m => m.newDate || m.date;
const parseD2 = x => { const q=(x||'').split('/'); return q.length===3 ? new Date(+q[2],+q[1]-1,+q[0]) : null; };
const keyOf = m => { const d = parseD2(effDate(m)); return (d ? d.getTime() : 0) + (parseInt(String(m.time||'0:0').replace(':','')) || 0); };
function resCard(m, big){
  const played = m.s1!=='' && m.s2!=='' && m.s1!=null && m.s2!=null;
  const sam = m.home===ME || m.away===ME;
  const dt = m.newDate ? `<span class="old">${esc(m.date)}</span><span class="new">${esc(m.newDate)}</span>` : esc(m.date);
  return `<div class="card ${sam?'sam':''} ${big?'next':''}">${big?'<div class="lab">Prossima partita</div>':''}<div class="when">${dt} · ${m.oldTime?`<span class="old">${esc(m.oldTime)}</span><span class="new">${esc(m.time)}</span>`:esc(m.time)}</div>
    <div class="res"><div class="t h">${esc(m.home)}</div><div class="sc ${played?'':'na'}">${played ? esc(m.s1)+' - '+esc(m.s2) : 'vs'}</div><div class="t">${esc(m.away)}</div></div>
    ${big?`<div style="margin-top:12px"><button class="b si" style="width:100%;padding:14px" onclick="setTab('pres')">✅ Segna la presenza</button></div>`:''}</div>`;
}
function renderCal(){
  const ms = allMatches();
  if(!ms.length) return tChips() + '<div class="msg">Calendario non ancora disponibile.</div>';
  const tdy = new Date(); tdy.setHours(0,0,0,0);
  const isUp = m => { const d = parseD2(effDate(m)); return d && d >= tdy; };
  const isSam = m => m.home===ME || m.away===ME;
  const nextM = ms.filter(m => isSam(m) && isUp(m)).sort((a,b)=>keyOf(a)-keyOf(b))[0];
  const flt = m => m !== nextM && (calFilter==='all' || isSam(m));
  const up = ms.filter(m => isUp(m) && flt(m)).sort((a,b)=>keyOf(a)-keyOf(b));
  const past = ms.filter(m => !isUp(m) && flt(m)).sort((a,b)=>keyOf(b)-keyOf(a));
  let h = tChips();
  if(nextM) h += resCard(nextM, true);
  h += `<div class="chips"><span class="chip ${calFilter==='all'?'on':''}" onclick="calFilter='all';render()">Tutte</span><span class="chip ${calFilter==='sam'?'on':''}" onclick="calFilter='sam';render()">Solo ${ME}</span></div>`;
  if(up.length) h += '<div class="sec">Prossime partite</div>' + up.map(m=>resCard(m,false)).join('');
  if(past.length) h += '<div class="sec">Già giocate · risultati</div>' + past.map(m=>resCard(m,false)).join('');
  return h;
}
function renderClass(){
  const ms = allMatches();
  if(!ms.length) return tChips() + '<div class="msg">Classifica non ancora disponibile.</div>';
  const CT = curT(), Q = CT.q==null ? 4 : +CT.q;
  const t = {}; (CT.teams||[]).forEach(n => { t[n] = {nome:n,pt:0,g:0,v:0,n:0,p:0,gf:0,gs:0,dr:0}; });
  ms.forEach(m => [m.home,m.away].forEach(n => { if(!t[n]) t[n] = {nome:n,pt:0,g:0,v:0,n:0,p:0,gf:0,gs:0,dr:0}; }));
  ms.forEach(m => {
    if(m.s1===''||m.s2===''||m.s1==null||m.s2==null||isNaN(parseInt(m.s1))||isNaN(parseInt(m.s2))) return;
    const a=parseInt(m.s1), b=parseInt(m.s2), H=t[m.home], A=t[m.away];
    H.g++;A.g++;H.gf+=a;H.gs+=b;A.gf+=b;A.gs+=a;
    if(a>b){H.v++;H.pt+=3;A.p++} else if(a<b){A.v++;A.pt+=3;H.p++} else {H.n++;A.n++;H.pt++;A.pt++}
  });
  const arr = Object.values(t); arr.forEach(x=>x.dr=x.gf-x.gs);
  arr.sort((a,b)=> b.pt-a.pt || b.dr-a.dr || b.gf-a.gf);
  let h = tChips() + '<table><thead><tr><th>Pos</th><th class="l">Squadra</th><th>PT</th><th>G</th><th>V</th><th>N</th><th>P</th><th>GF</th><th>GS</th><th>DR</th></tr></thead><tbody>';
  arr.forEach((x,i)=>{ h += `<tr class="${Q ? (i<Q?'q':'e') : ''} ${x.nome===ME?'me':''}"><td><b>${i+1}</b></td><td class="l">${esc(x.nome)}</td><td style="color:#60a5fa"><b>${x.pt}</b></td><td>${x.g}</td><td>${x.v}</td><td>${x.n}</td><td>${x.p}</td><td>${x.gf}</td><td>${x.gs}</td><td class="${x.dr>0?'pos':x.dr<0?'neg':''}"><b>${x.dr>0?'+'+x.dr:x.dr}</b></td></tr>`; });
  return h + '</tbody></table><div class="legend">' + (Q ? `<div><i style="background:#14532d"></i>Qualificate (1°-${Q}°)</div><div style="margin-top:4px"><i style="background:#7f1d1d"></i>Non qualificate</div>` : '') + (pub.upd ? `<div style="margin-top:4px">Aggiornata il ${new Date(pub.upd).toLocaleString('it-IT',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</div>` : '') + '</div>';
}
async function loadNews(){ try{ const r = await fetch(`${DB}/news.json`); news = (r.ok && await r.json()) || {}; }catch(e){} }
const NTYPES = {promemoria:'⏰ Promemoria', info:'💬 Comunicazione', importante:'⚠️ Importante'};
const SEEN = 'wcSeen_' + TOK;
function seenAt(){ try{ return localStorage.getItem(SEEN) || ''; }catch(e){ return ''; } }
function markSeen(){ try{ localStorage.setItem(SEEN, new Date().toISOString()); }catch(e){} }
function liveNews(){
  const t = new Date(); t.setHours(0,0,0,0);
  return Object.entries(news||{}).filter(([k,n]) => n).map(([id,n]) => ({id,...n}))
    .filter(n => { const d = parseD(n.until); return !d || d >= t; })
    .sort((a,b) => ((b.pin?1:0)-(a.pin?1:0)) || String(b.date).localeCompare(String(a.date)));
}
function unread(){ const s = seenAt(); return liveNews().filter(n => !s || String(n.date) > s || String(n.upd||'') > s).length; }
const linkify = t => esc(t).replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener" style="color:#60a5fa">$1</a>');
const fmtTs = iso => { try{ return new Date(iso).toLocaleString('it-IT',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}); }catch(e){ return ''; } };
function newsCard(n, isNew){
  return `<div class="card ${n.type==='importante'?'imp':''} ${n.pin?'pin':''}"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span><span class="nt ${esc(n.type)}">${NTYPES[n.type]||''}</span>${isNew?'<span class="newb">Nuovo</span>':''}</span><span class="nmeta">${n.pin?'📌 ':''}${fmtTs(n.date)}</span></div>
    ${n.title?`<div class="ntitle">${esc(n.title)}</div>`:''}<div class="ntext">${linkify(n.text||'')}</div></div>`;
}
function renderNews(){
  const l = liveNews(), s = seenAt();
  if(!l.length) return '<div class="msg">Nessun avviso al momento.</div>';
  return l.map(n => newsCard(n, !s || String(n.date) > s || String(n.upd||'') > s)).join('');
}
/* ===== notifiche push (comune) ===== */
const b64u = s => { const p = '='.repeat((4 - s.length % 4) % 4); const b = atob((s + p).replace(/-/g,'+').replace(/_/g,'/')); return Uint8Array.from(b, c => c.charCodeAt(0)); };
async function sidOf(ep){ const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(ep)); return Array.from(new Uint8Array(b)).slice(0,12).map(x => x.toString(16).padStart(2,'0')).join(''); }
const isIOS = () => /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isStandalone = () => (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
const swReady = () => Promise.race([navigator.serviceWorker.ready, new Promise((_, r) => setTimeout(() => r(new Error('sw')), 6000))]);
// 'nokey' | 'ios' | 'unsupported' | 'denied' | 'on' | 'off'
async function pushState(vapid){
  if(!vapid) return 'nokey';
  if(!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)) return (isIOS() && !isStandalone()) ? 'ios' : 'unsupported';
  if(Notification.permission === 'denied') return 'denied';
  try{ const reg = await swReady(); const s = await reg.pushManager.getSubscription(); return (s && Notification.permission === 'granted') ? 'on' : 'off'; }catch(e){ return 'off'; }
}
async function subscribePush(vapid){
  const perm = await Notification.requestPermission();
  if(perm !== 'granted') throw new Error(perm === 'denied' ? 'denied' : 'dismissed');
  const reg = await swReady();
  let sub = await reg.pushManager.getSubscription();
  if(!sub) sub = await reg.pushManager.subscribe({userVisibleOnly: true, applicationServerKey: b64u(vapid)});
  const j = sub.toJSON();
  return {sid: await sidOf(j.endpoint), rec: {endpoint: j.endpoint, keys: j.keys, url: location.href.split('#')[0], date: new Date().toISOString()}};
}
async function unsubscribePush(){
  const reg = await swReady(); const s = await reg.pushManager.getSubscription(); if(!s) return null;
  const sid = await sidOf(s.endpoint); await s.unsubscribe(); return sid;
}
const IOS_HELP = 'Su iPhone le notifiche funzionano solo dall\'icona sulla schermata Home: tocca <b>Condividi</b> (il quadrato con la freccia) → <b>Aggiungi alla schermata Home</b>, poi apri la pagina da quell\'icona e attiva le notifiche.';

const PNO = 'wcPushNo_' + TOK;
function pushBox(compact){
  if(pState === 'nokey') return '';
  if(compact){ let no = false; try{ no = !!localStorage.getItem(PNO); }catch(e){} if(no || !['off','ios'].includes(pState)) return ''; }
  const later = compact ? `<button class="sec" onclick="try{localStorage.setItem(PNO,'1')}catch(e){};render()">Non ora</button>` : '';
  if(pState === 'ios') return `<div class="pbox">🔔 Vuoi un avviso quando c'è un nuovo messaggio o manca la tua risposta?<br>${IOS_HELP}${compact?`<div class="pb2">${later}</div>`:''}</div>`;
  if(pState === 'off') return `<div class="pbox">🔔 Ricevi un avviso quando c'è un nuovo messaggio o manca la tua risposta.<div class="pb2"><button onclick="enablePushP()">Attiva le notifiche</button>${later}</div></div>`;
  if(pState === 'on') return `<div class="pbox" style="border-color:#16a34a">🔔 Notifiche attive su questo telefono.<div class="pb2"><button class="sec" onclick="disablePushP()">Disattiva</button></div></div>`;
  if(pState === 'denied') return `<div class="pbox" style="border-color:#b91c1c">Hai bloccato le notifiche per questa pagina. Per riceverle riattivale dalle impostazioni del telefono o del browser.</div>`;
  return `<div class="pbox" style="border-color:#374151;color:#9ca3af">Su questo browser le notifiche non sono disponibili.</div>`;
}
async function enablePushP(){
  try{
    const {sid, rec} = await subscribePush(vapid);
    const r = await fetch(`${DB}/push/fam/${TOK}/${sid}.json`, {method:'PUT', body: JSON.stringify(rec)});
    if(!r.ok) throw new Error('salvataggio');
    pState = 'on'; toast('Notifiche attive ✓');
  }catch(e){
    if(e.message === 'denied') pState = 'denied';
    else if(e.message !== 'dismissed') toast('Non riesco ad attivare le notifiche', true);
  }
  render();
}
async function disablePushP(){
  try{ const sid = await unsubscribePush(); if(sid) await fetch(`${DB}/push/fam/${TOK}/${sid}.json`, {method:'DELETE'}); pState = 'off'; toast('Notifiche disattivate'); }
  catch(e){ toast('Errore, riprova', true); }
  render();
}
function setTab(t){ tab = t; render(); window.scrollTo(0,0); }
function render(){
  const u = unread();
  const tabs = `<div class="tabs"><button class="${tab==='pres'?'on':''}" onclick="setTab('pres')">Presenza</button><button class="${tab==='avv'?'on':''}" onclick="setTab('avv')">Avvisi${u&&tab!=='avv'?`<span class="newb">${u}</span>`:''}</button><button class="${tab==='cal'?'on':''}" onclick="setTab('cal')">Calendario</button><button class="${tab==='cla'?'on':''}" onclick="setTab('cla')">Classifica</button></div>`;
  main.innerHTML = tabs + (tab==='cal' ? renderCal() : tab==='cla' ? renderClass() : tab==='avv' ? pushBox(false) + renderNews() : renderPres());
  if(tab==='avv') markSeen();
}
let pending = null;
function closePop(){ document.getElementById('ov').classList.remove('on'); pending = null; }
function set(id, v){
  const cur = rsvp[id], nv = (cur === v) ? null : v;
  const m = fam.matches[id]; if(!m) return;
  pending = {id, nv};
  const si0 = countsOf(id).si - (cur==='si'?1:0), si1 = si0 + (nv==='si'?1:0);
  const what = `${esc(fam.name)} · ${esc(m.home)} vs ${esc(m.away)}<br>${esc(m.date)} ore ${esc(m.time)}`;
  let ic, title, body, cls, label;
  if(nv==='si'){ ic='✅'; title='Confermi la presenza?'; body=`Segno che <b>${esc(fam.name)}</b> ci sarà.`; cls='si'; label='Sì, ci sarà'; }
  else if(nv==='no'){ ic='❌'; title="Confermi l'assenza?"; body=`Segno che <b>${esc(fam.name)}</b> non ci sarà.`; cls='no'; label='Sì, non ci sarà'; }
  else { ic='↩️'; title='Togliere la risposta?'; body=`Vuoi togliere la risposta${cur==='si'?' di presenza':' di assenza'} per <b>${esc(fam.name)}</b>? Tornerà "senza risposta".`; cls='rm'; label='Sì, togli'; }
  const info = si1 >= MIN ? `<div class="inf ok">Dopo questa risposta: ${si1} su ${MIN} minimo · ✅ ci siamo per giocare</div>`
                          : `<div class="inf wait">Dopo questa risposta: ${si1} su ${MIN} minimo · mancano ${MIN-si1}</div>`;
  document.getElementById('pop').innerHTML = `<div class="ic">${ic}</div><h2>${title}</h2><p>${body}</p><p style="font-size:13px;color:#9ca3af">${what}</p>${info}
    <div class="pb"><button class="go ${cls}" onclick="commit()">${label}</button><button class="cc" onclick="closePop()">Annulla</button></div>`;
  document.getElementById('ov').classList.add('on');
}
async function commit(){
  if(!pending) return; const {id, nv} = pending; closePop();
  const prev = rsvp[id];
  if(nv===null) delete rsvp[id]; else rsvp[id] = nv;
  if(fam.pid){ if(nv===null){ if(votes[id]) delete votes[id][fam.pid]; } else (votes[id] = votes[id] || {})[fam.pid] = nv; }
  render();
  try{
    const r = await fetch(`${DB}/rsvp/${TOK}/${id}.json`,{method: nv===null?'DELETE':'PUT', body: nv===null?undefined:JSON.stringify(nv)});
    if(!r.ok) throw 0;
    toast(nv===null ? 'Risposta tolta ✓' : nv==='si' ? 'Presenza salvata ✓' : 'Assenza salvata ✓');
    if(fam.pid){
      fetch(`${DB}/votes/${id}/${fam.pid}.json`,{method: nv===null?'DELETE':'PUT', body: nv===null?undefined:JSON.stringify(nv)}).catch(()=>{})
        .then(loadVotes).then(() => { if(fam.pid){ if(nv===null){ if(votes[id]) delete votes[id][fam.pid]; } else (votes[id] = votes[id] || {})[fam.pid] = nv; } render(); });
    }
  }catch(e){
    if(prev) rsvp[id]=prev; else delete rsvp[id];
    await loadVotes(); render(); toast('Non salvato, riprova',true);
  }
}
init();
</script>
